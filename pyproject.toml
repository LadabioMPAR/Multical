[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multical"
version = "0.1.0"
description = "Multivariate calibration tool for spectroscopic data (PLS, PCR, SPA, SVR)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
ann = ["torch"]      # only needed by multical.models.ann_torch
gui = ["PySide6-Essentials"]   # the desktop interface (multical_gui)
build = ["pyinstaller", "PySide6-Essentials"]   # to make the Windows program: py packaging/build.py
test = ["pytest"]    # optional: the tests also run with `python -m unittest`

[project.gui-scripts]
multical-gui = "multical_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
